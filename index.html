<!DOCTYPE html>
<html lang="en" class="dark">
  <head>

    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Produscope – Student & Parent Finance</title>

    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                blue: "#2563eb",
                green: "#22c55e",
                teal: "#06b6d4",
                ink: "#0b1220",
              },
            },
            boxShadow: {
              soft: "0 10px 30px rgba(0,0,0,0.08)",
              lift: "0 12px 40px rgba(0,0,0,0.12)",

            fontFamily: {
              ui: [
                "Inter",
                "ui-sans-serif",
                "system-ui",
                "Segoe UI",

                "Helvetica",
                "Arial",
                "sans-serif",

            transitionTimingFunction: { gentle: "cubic-bezier(.2,.8,.2,1)" },
            keyframes: {
              floaty: {
                "0%,100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-6px)" },

                "100%": { transform: "scale(1)", opacity: 1 },

                "100%": { transform: "translateY(0)", opacity: 1 },

              floaty: "floaty 6s ease-in-out infinite",
              shimmer: "shimmer 8s linear infinite",
              pop: "pop .25s ease",
              enter: "enter .4s gentle both",

          },
        },
      };

    <style>
      :root {
        --blue: #2563eb;
        --green: #22c55e;
        --teal: #06b6d4;
        --ink: #0b1220;

      .dark .bg-mesh {
        background: radial-gradient(

            rgba(34, 197, 94, 0.18),

            transparent 60%

          radial-gradient(
            50vmax 50vmax at 30% 80%,

      }
      .brand-gradient {
        background: linear-gradient(
          135deg,
          var(--teal),

      .brand-gradient-2 {

        backdrop-filter: blur(10px);

        .bg-mesh,
        .animate-floaty,

        .animate-pop {

      }
      *:focus-visible {
        outline: 2px solid var(--teal);
        outline-offset: 2px;
        border-radius: 10px;
      }

      /* NEW: Permanent-contrast sidebar (dark text on light theme, white text on dark theme) */
      .sidebar {
        background: linear-gradient(
          180deg,
          rgba(6, 182, 212, 0.95),
          rgba(37, 99, 235, 0.98) 60%,
          rgba(34, 197, 94, 0.96)

      }
      .sidebar .nav-btn {
        color: rgba(255, 255, 255, 0.9);
      }
      .sidebar .nav-btn.active,

  <body
    class="min-h-screen bg-[var(--bgLight)] dark:bg-[var(--bgDark)] text-slate-900 dark:text-slate-100 font-ui"
  >
    <div class="bg-mesh"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect, useRef, useContext } = React;

      /* -------------------- Utilities & Persistence -------------------- */
      const genId = (p = "id") =>
        `${p}_${Date.now().toString(36)}_${Math.random()
          .toString(36)
          .slice(2, 7)}`;
      const genStudentCode = () =>
        `STU-${Math.random()
          .toString(36)
          .slice(2, 6)
          .toUpperCase()}-${Math.random()
          .toString(36)
          .slice(2, 6)
          .toUpperCase()}`;
      const saveLS = (k, v) => localStorage.setItem(k, JSON.stringify(v));
      const loadLS = (k, fallback) => {
        try {
          const v = localStorage.getItem(k);
          return v ? JSON.parse(v) : fallback;
        } catch {
          return fallback;
        }
      };

      const ThemeCtx = React.createContext({ theme: "dark", toggle: () => {} });
      function ThemeProvider({ children }) {
        const [theme, setTheme] = useState(
          () => localStorage.getItem("ps_theme") || "dark"
        );
        useEffect(() => {
          const root = document.documentElement;
          if (theme === "dark") root.classList.add("dark");
          else root.classList.remove("dark");
          localStorage.setItem("ps_theme", theme);
        }, [theme]);
        const toggle = () => setTheme((t) => (t === "dark" ? "light" : "dark"));
        return (
          <ThemeCtx.Provider value={{ theme, toggle }}>
            {children}
          </ThemeCtx.Provider>
        );
      }

      /* -------------------- Mock Store (with persistence) -------------------- */
      const initial = {
        users: {
          student1: {
            id: "student1",
            type: "student",
            code: "STU-DEMO-0001",
            name: "Shruti Singh",
            college: "IIT Guwahati",
            upiLinked: false,
            upiId: "",
            wallet: 2500,
            savings: 1200,
            savingsGoal: 2000,
            offersRedeemed: 0,
            splitsMade: 2,
            weeklySpend: [1200, 950, 1100, 800],
            categories: [
              { key: "Hostel", amount: 1500, icon: "🏠" },
              { key: "Mess", amount: 980, icon: "🍛" },
              { key: "Travel", amount: 340, icon: "🚌" },
              { key: "Fun", amount: 420, icon: "🎉" },
            ],
            commitments: [
              {
                id: "c1",
                title: "Goa Trip",
                amount: 700,
                lockedTill: "2025-10-10",
                penaltyPct: 10,
              },
            ],
            groups: ["g1"],
            restrictedWallets: { Hostel: 0, Mess: 0 },
          },
          /* Extra students for Leaderboard (same college) */
          stuA: {
            id: "stuA",
            type: "student",
            code: "STU-A-1111",
            name: "Riya Patel",
            college: "IIT Guwahati",
            upiLinked: true,
            upiId: "riya@upi",
            wallet: 3400,
            savings: 1700,
            savingsGoal: 2500,
            offersRedeemed: 3,
            splitsMade: 5,
            weeklySpend: [900, 780, 820, 860],
            categories: [
              { key: "Hostel", amount: 1200, icon: "🏠" },
              { key: "Mess", amount: 880, icon: "🍛" },
              { key: "Travel", amount: 120, icon: "🚌" },
              { key: "Fun", amount: 260, icon: "🎉" },
            ],
            commitments: [
              {
                id: "c2",
                title: "Laptop Fund",
                amount: 900,
                lockedTill: "2025-12-01",
                penaltyPct: 10,
              },
            ],
            groups: [],
            restrictedWallets: { Hostel: 200, Mess: 100 },
          },
          stuB: {
            id: "stuB",
            type: "student",
            code: "STU-B-2222",
            name: "Aman Verma",
            college: "IIT Guwahati",
            upiLinked: false,
            upiId: "",
            wallet: 1600,
            savings: 900,
            savingsGoal: 2000,
            offersRedeemed: 1,
            splitsMade: 3,
            weeklySpend: [1100, 1150, 980, 1200],
            categories: [
              { key: "Hostel", amount: 1400, icon: "🏠" },
              { key: "Mess", amount: 760, icon: "🍛" },
              { key: "Travel", amount: 210, icon: "🚌" },
              { key: "Fun", amount: 520, icon: "🎉" },
            ],
            commitments: [],
            groups: [],
            restrictedWallets: { Hostel: 0, Mess: 0 },
          },
          /* Parent */
          parent1: {
            id: "parent1",
            type: "parent",
            name: "Rajesh Kumar",
            childIds: ["student1", "stuB"],
          },
        },
        groups: {
          g1: {
            id: "g1",
            name: "Hostel Gang",
            members: ["student1"],
            expenses: [
              {
                id: "e1",
                desc: "Pizza Night",
                amount: 800,
                paidBy: "student1",
                splitAmong: ["student1"],
                date: "2025-08-15",
              },
            ],
          },
        },
        offers: [
          {
            id: "o1",
            name: "Campus Canteen",
            detail: "20% off Thali",
            distance: "120m",
            sponsor: true,
            emoji: "🍽",
          },
          {
            id: "o2",
            name: "Gate Chai Point",
            detail: "Buy 1 Get 1 Chai",
            distance: "60m",
            sponsor: false,
            emoji: "🫖",
          },
          {
            id: "o3",
            name: "Bookstore",
            detail: "15% off Textbooks",
            distance: "200m",
            sponsor: true,
            emoji: "📚",
          },
        ],
        microSponsorships: [
          {
            id: "m1",
            title: "Weekly Saver",
            rule: "Save ₹500 this week",
            reward: "₹50 cashback",
          },
        ],
      };

      const StoreCtx = React.createContext();
      const AuthCtx = React.createContext();

      function StoreProvider({ children }) {
        const [store, setStore] = useState(() => loadLS("ps_store", initial));
        useEffect(() => saveLS("ps_store", store), [store]);

        const updateUser = (id, patch) =>
          setStore((s) => ({
            ...s,
            users: { ...s.users, [id]: { ...s.users[id], ...patch } },
          }));
        const updateGroup = (id, patch) =>
          setStore((s) => ({
            ...s,
            groups: { ...s.groups, [id]: { ...s.groups[id], ...patch } },
          }));

        const createStudent = ({ name, college }) => {
          const id = genId("stu");
          const code = genStudentCode();
          const base = {
            id,
            type: "student",
            name: name || "Student",
            college: college || "",
            code,
            upiLinked: false,
            upiId: "",
            wallet: 0,
            savings: 0,
            savingsGoal: 2000,
            weeklySpend: [600, 780, 500, 920],
            offersRedeemed: 0,
            splitsMade: 0,
            categories: [
              { key: "Hostel", amount: 0, icon: "🏠" },
              { key: "Mess", amount: 0, icon: "🍛" },
              { key: "Travel", amount: 0, icon: "🚌" },
              { key: "Fun", amount: 0, icon: "🎉" },
            ],
            commitments: [],
            groups: [],
            restrictedWallets: { Hostel: 0, Mess: 0 },
          };
          setStore((s) => ({ ...s, users: { ...s.users, [id]: base } }));
          return base;
        };

        const createParent = ({ name, studentIds = [] }) => {
          const id = genId("par");
          const parent = {
            id,
            type: "parent",
            name: name || "Parent",
            childIds: [...studentIds],
          };
          setStore((s) => ({ ...s, users: { ...s.users, [id]: parent } }));
          return parent;
        };

        const findStudentByCode = (code) => {
          const users = Object.values(store.users);
          return (
            users.find((u) => u.type === "student" && u.code === code) || null
          );
        };

        const linkChildToParent = ({ parentId, studentCode }) => {
          const stu = findStudentByCode(studentCode);
          if (!stu) return { ok: false, reason: "No student with that code" };
          setStore((s) => {
            const p = s.users[parentId];
            if (!p || p.type !== "parent") return s;
            if (p.childIds.includes(stu.id)) return s;
            return {
              ...s,
              users: {
                ...s.users,
                [parentId]: { ...p, childIds: [...p.childIds, stu.id] },
              },
            };
          });
          return { ok: true, studentId: stu.id };
        };

        return (
          <StoreCtx.Provider
            value={{
              store,
              updateUser,
              updateGroup,
              createStudent,
              createParent,
              findStudentByCode,
              linkChildToParent,
            }}
          >
            {children}
          </StoreCtx.Provider>
        );
      }

      function AuthProvider({ children }) {
        const { store } = useContext(StoreCtx);
        const [session, setSession] = useState(() =>
          loadLS("ps_session", null)
        );
        const user = session ? store.users[session.id] : null;

        const login = (id) => {
          const v = { id, type: store.users[id]?.type };
          setSession(v);
          saveLS("ps_session", v);
        };
        const logout = () => {
          setSession(null);
          saveLS("ps_session", null);
        };

        useEffect(() => saveLS("ps_session", session), [session]);

        return (
          <AuthCtx.Provider value={{ user, login, logout, setSession }}>
            {children}
          </AuthCtx.Provider>
        );
      }

      /* -------------------- UI Primitives -------------------- */
      const Page = ({ children, compact }) => (
        <div className={`max-w-7xl mx-auto px-4 ${compact ? "py-4" : "py-6"}`}>
          {children}
        </div>
      );

      const Card = ({
        title,
        subtitle,
        right,
        children,
        variant = "default",
      }) => (
        <div
          className={`rounded-2xl card border border-white/20 dark:border-white/10 ${
            variant === "glass" ? "glass" : "bg-white dark:bg-slate-900"
          } p-5 md:p-6 animate-enter`}
        >
          <div className="flex items-start justify-between gap-3 mb-4">
            <div>
              <h3 className="text-lg md:text-xl font-bold tracking-tight text-slate-900 dark:text-white">
                {title}
              </h3>
              {subtitle && (
                <p className="text-xs md:text-sm text-slate-600 dark:text-slate-300">
                  {subtitle}
                </p>
              )}
            </div>
            {right}
          </div>
          <div className="text-slate-800 dark:text-slate-200">{children}</div>
        </div>
      );

      const Stat = ({ label, value, sub, emph }) => (
        <div
          className={`p-4 rounded-xl ${
            emph
              ? "brand-gradient text-white"
              : "bg-slate-50 dark:bg-slate-800/60"
          } animate-pop`}
        >
          <p
            className={`${
              emph ? "text-white/85" : "text-slate-600 dark:text-slate-300"
            } text-xs`}
          >
            {label}
          </p>
          <p
            className={`text-2xl md:text-3xl font-extrabold tracking-tight ${
              emph ? "text-white" : "text-slate-900 dark:text-white"
            }`}
          >
            {value}
          </p>
          {sub && (
            <p
              className={`${
                emph ? "text-white/80" : "text-slate-600 dark:text-slate-300"
              } text-xs mt-1`}
            >
              {sub}
            </p>
          )}
        </div>
      );

      const Progress = ({ pct }) => (
        <div className="w-full h-3 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
          <div
            className="h-3 rounded-full"
            style={{
              width: `${Math.min(Math.max(pct, 0), 100)}%`,
              backgroundImage:
                "linear-gradient(90deg, var(--teal), var(--blue) 60%, var(--green))",
            }}
          />
        </div>
      );

      /* -------------------- Mascot & Sidebar -------------------- */
      const Mascot = () => (
        <div className="flex items-center gap-3">
          <div className="relative">
            <div className="w-10 h-10 rounded-2xl bg-emerald-300/80 flex items-center justify-center animate-floaty">
              🐧
            </div>
            <span className="absolute -z-10 inset-0 rounded-2xl animate-[pulseRing_2s_ease-out_infinite] bg-white/10"></span>
          </div>
          <span
            className="font-extrabold text-xl bg-clip-text text-transparent"
            style={{ backgroundImage: "linear-gradient(135deg,#fff,#fff)" }}
          >
            Produscope
          </span>
        </div>
      );

      function ThemeToggle() {
        const { theme, toggle } = useContext(ThemeCtx);
        return (
          <button
            onClick={toggle}
            type="button"
            className="px-3 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white shadow-soft transition-shadow"
            aria-label="Toggle theme"
          >
            {theme === "dark" ? "☀️ Light" : "🌙 Dark"}
          </button>
        );
      }

      function Sidebar({
        active,
        setActive,
        isOpen,
        setIsOpen,
        parentChildId,
        setParentChildId,
      }) {
        const { user, logout } = useContext(AuthCtx);
        const { store } = useContext(StoreCtx);
        const isParent = user?.type === "parent";

        const tabsStudent = [
          ["dashboard", "Home", "🏠"],
          ["leader", "Leaderboard", "🏆"],
          ["weekly", "Weekly", "📈"],
          ["categories", "Categories", "🧾"],
          ["savings", "Savings", "💰"],
          ["commit", "Locks", "🔒"],
          ["split", "Split", "👥"],
          ["offers", "Offers", "🏪"],
          ["upi", "UPI", "🔗"],
          ["parent", "Parent", "👨‍👩‍👦"],
        ];
        const tabsParent = [
          ["parent", "Top-Up", "💳"],
          ["monitor", "Monitor", "👀"],
          ["manage", "Manage", "🧩"],
          ["leader", "Leaderboard", "🏆"],
        ];
        const tabs = isParent ? tabsParent : tabsStudent;

        return (
          <>
            {/* Mobile overlay */}
            <div
              className={`fixed inset-0 bg-black/40 z-40 md:hidden transition ${
                isOpen ? "opacity-100 visible" : "opacity-0 invisible"
              }`}
              onClick={() => setIsOpen(false)}
            ></div>

            <aside
              className={`sidebar fixed md:sticky top-0 left-0 h-screen w-72 md:w-72 z-50 md:z-10 p-4 md:p-6 flex flex-col gap-4 transform transition
                             ${
                               isOpen
                                 ? "translate-x-0"
                                 : "-translate-x-full md:translate-x-0"
                             } shadow-2xl`}
            >
              <div className="flex items-center justify-between">
                <Mascot />
                <button
                  className="md:hidden text-white text-2xl leading-none px-2"
                  onClick={() => setIsOpen(false)}
                >
                  ✕
                </button>
              </div>

              <div className="text-white/90 text-xs">Student-First Finance</div>

              <div className="flex flex-col gap-1">
                {tabs.map(([id, label, icon]) => (
                  <button
                    key={id}
                    onClick={() => {
                      setActive(id);
                      setIsOpen(false);
                    }}
                    className={`nav-btn text-left px-3 py-2 rounded-xl transition flex items-center gap-2 ${
                      active === id ? "active" : ""
                    }`}
                  >
                    <span className="text-lg">{icon}</span>
                    <span className="font-medium">{label}</span>
                  </button>
                ))}
              </div>

              <div className="mt-auto flex flex-col gap-2">
                {isParent && (
                  <div className="text-sm">
                    <label className="block text-white/80 mb-1">
                      Filter by student
                    </label>
                    <select
                      className="w-full px-3 py-2 rounded-xl bg-white/15 text-white"
                      value={parentChildId || ""}
                      onChange={(e) => setParentChildId(e.target.value)}
                    >
                      <option className="text-black" value="">
                        All
                      </option>
                      {user.childIds.map((cid) => {
                        const c = store.users[cid];
                        return (
                          <option className="text-black" key={cid} value={cid}>
                            {c?.name || cid}
                          </option>
                        );
                      })}
                    </select>
                  </div>
                )}
                <ThemeToggle />
                <div className="text-xs text-white/90">Hi, {user?.name}</div>
                <button
                  onClick={logout}
                  className="px-3 py-2 rounded-xl bg-rose-500 text-white hover:bg-rose-600"
                >
                  Logout
                </button>
              </div>
            </aside>
          </>
        );
      }

      /* -------------------- Helpers -------------------- */
      function useConfetti() {
        const containerRef = useRef(null);
        const burst = () => {
          const el = containerRef.current;
          if (!el) return;
          for (let i = 0; i < 24; i++) {
            const d = document.createElement("div");
            d.className = "confetti";
            d.style.left = Math.random() * 220 + 20 + "px";
            d.style.backgroundColor = [
              "#22c55e",
              "#06b6d4",
              "#2563eb",
              "#34d399",
            ][i % 4];
            el.appendChild(d);
            setTimeout(() => d.remove(), 1200);
          }
        };
        return { containerRef, burst };
      }

      /* -------------------- Student Screens -------------------- */
      function Dashboard() {

      function CommitLocks({ compact }) {
        const { user } = useContext(AuthCtx);
        const { updateUser } = useContext(StoreCtx);
        const [title, setTitle] = useState("Fest Fund");
        const [amount, setAmount] = useState("300");
        const [until, setUntil] = useState(
          new Date().toISOString().split("T")[0]
        );

        const create = () => {
          const a = parseInt(amount || "0", 10);
          if (!a) return;
          if (a > user.wallet) return alert("Not enough wallet");
          const newLock = {
            id: "c" + Date.now(),
            title,
            amount: a,
            lockedTill: until,
            penaltyPct: 10,
          };
          updateUser(user.id, {
            commitments: [...user.commitments, newLock],
            wallet: user.wallet - a,
          });
        };

        const emergency = (id) => {
          const cm = user.commitments.find((x) => x.id === id);
          if (!cm) return;
          const today = new Date().toISOString().split("T")[0];
          if (today >= cm.lockedTill) {
            updateUser(user.id, {
              commitments: user.commitments.filter((x) => x.id !== id),
              wallet: user.wallet + cm.amount,
            });
            return alert(`Lock matured. Returned full ₹${cm.amount}.`);
          }
          const penalty = Math.round(cm.amount * (cm.penaltyPct / 100));
          const back = cm.amount - penalty;
          updateUser(user.id, {
            commitments: user.commitments.filter((x) => x.id !== id),
            wallet: user.wallet + back,
          });
          alert(`Lock broken. Penalty ₹${penalty}. Returned ₹${back}.`);
        };

        return (
          <Card
            title={compact ? "Commitment Locks" : "Commitment Locks (Gamified)"}
            subtitle="Lock, grow, unlock with discipline"
          >
            {!compact && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                <input
                  className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                />
                <input
                  className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                  type="number"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                />
                <input
                  className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                  type="date"
                  value={until}
                  onChange={(e) => setUntil(e.target.value)}
                />
                <button
                  onClick={create}
                  type="button"
                  className="md:col-span-3 px-3 py-2 rounded-xl btn-grad text-white shadow-soft hover:shadow-lift transition"
                >
                  Lock Amount
                </button>
              </div>
            )}

            {user.commitments.length ? (
              <div className="space-y-3">
                {user.commitments.map((cm) => (
                  <div
                    key={cm.id}
                    className="p-3 border dark:border-slate-700 rounded-xl flex items-center justify-between bg-slate-50/80 dark:bg-slate-800/60"
                  >
                    <div>
                      <p className="font-semibold text-slate-800 dark:text-slate-100">
                        🔒 {cm.title}
                      </p>
                      <p className="text-xs text-slate-700 dark:text-slate-300">
                        ₹{cm.amount} · till {cm.lockedTill} · Penalty{" "}
                        {cm.penaltyPct}%
                      </p>
                    </div>
                    <div className="flex gap-2">
                      <button
                        className="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100"
                        onClick={() => alert("Unlocks after " + cm.lockedTill)}
                      >
                        Info
                      </button>
                      <button
                        className="px-3 py-2 rounded-xl bg-rose-500 text-white hover:bg-rose-600"
                        onClick={() => emergency(cm.id)}
                      >
                        Emergency Unlock
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <p className="text-sm text-slate-700 dark:text-slate-300">

              </p>
            )}
          </Card>
        );
      }

      function Leaderboard() {
        const { store } = useContext(StoreCtx);
        const { user } = useContext(AuthCtx);

        // Collect students in same college (or all if parent with multiple colleges)
        const allStudents = Object.values(store.users).filter(
          (u) => u.type === "student"
        );
        const myCollege = user.type === "student" ? user.college : null;
        const list = myCollege
          ? allStudents.filter((s) => s.college === myCollege)
          : allStudents;

        const scoreOf = (s) => {
          const progress = s.savingsGoal
            ? Math.min(100, Math.round((s.savings / s.savingsGoal) * 100))
            : 0; // 0..100
          const walletScore = Math.min(
            100,
            Math.round((s.wallet / 5000) * 100)
          ); // cap at ₹5k
          const avgSpend = s.weeklySpend.length
            ? s.weeklySpend.reduce((a, b) => a + b, 0) / s.weeklySpend.length
            : 0;
          const spendDiscipline = Math.max(
            0,
            Math.min(
              100,
              Math.round(((1500 - Math.min(1500, avgSpend)) / 1500) * 100)
            )
          ); // lower spend -> higher score
          const locksScore = Math.min(100, (s.commitments?.length || 0) * 10);
          const upiBonus = s.upiLinked ? 5 : 0;
          const splitScore = Math.min(100, (s.splitsMade || 0) * 5);
          const offerScore = Math.min(100, (s.offersRedeemed || 0) * 5);
          // Weighted total (sums to 100)
          const total = Math.round(
            progress * 0.35 +
              walletScore * 0.2 +
              spendDiscipline * 0.2 +
              locksScore * 0.1 +
              splitScore * 0.05 +
              offerScore * 0.05 +
              upiBonus
          );
          return {
            total,
            breakdown: {
              progress,
              walletScore,
              spendDiscipline,
              locksScore,
              splitScore,
              offerScore,
              upiBonus,
            },
          };
        };

        const ranked = list
          .map((s) => ({ ...s, score: scoreOf(s) }))
          .sort((a, b) => b.score.total - a.score.total)
          .map((s, i) => ({ ...s, rank: i + 1 }));

        const prizes = ["₹500 cashback", "₹300 cashback", "₹200 cashback"];

        return (
          <Page>
            <Card
              title="Leaderboard"
              subtitle={myCollege ? `College: ${myCollege}` : "All Students"}
              variant="glass"
              right={
                <span className="text-xs">
                  Scoring: savings progress, wallet, disciplined weekly spend,
                  locks, splits, offers, UPI.
                </span>
              }
            >
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead>
                    <tr className="text-slate-900 dark:text-slate-100">
                      <th className="py-2">Rank</th>
                      <th className="py-2">Student</th>
                      <th className="py-2">Score</th>
                      <th className="py-2 hidden md:table-cell">Savings%</th>
                      <th className="py-2 hidden md:table-cell">Wallet</th>
                      <th className="py-2 hidden md:table-cell">Discipline</th>
                      <th className="py-2 hidden lg:table-cell">Locks</th>
                      <th className="py-2 hidden lg:table-cell">Splits</th>
                      <th className="py-2 hidden lg:table-cell">Offers</th>
                      <th className="py-2">Prize</th>
                    </tr>
                  </thead>
                  <tbody>
                    {ranked.map((s) => (
                      <tr
                        key={s.id}
                        className="border-t border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition"
                      >
                        <td className="py-2 font-bold">
                          {s.rank}{" "}
                          {s.rank <= 3 ? ["🥇", "🥈", "🥉"][s.rank - 1] : ""}
                        </td>
                        <td className="py-2">
                          {s.name}{" "}
                          <span className="text-xs text-slate-600 dark:text-slate-300">
                            ({s.college || "—"})
                          </span>
                        </td>
                        <td className="py-2 font-semibold">{s.score.total}</td>
                        <td className="py-2 hidden md:table-cell">
                          {s.score.breakdown.progress}%
                        </td>
                        <td className="py-2 hidden md:table-cell">
                          ₹{s.wallet}
                        </td>
                        <td className="py-2 hidden md:table-cell">
                          {s.score.breakdown.spendDiscipline}
                        </td>
                        <td className="py-2 hidden lg:table-cell">
                          {s.score.breakdown.locksScore}
                        </td>
                        <td className="py-2 hidden lg:table-cell">
                          {s.splitsMade || 0}
                        </td>
                        <td className="py-2 hidden lg:table-cell">
                          {s.offersRedeemed || 0}
                        </td>
                        <td className="py-2">
                          {s.rank <= 3 ? prizes[s.rank - 1] : "—"}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {ranked.length === 0 && (
                  <p className="text-sm mt-2">No students to rank.</p>
                )}
              </div>
            </Card>
          </Page>
        );
      }

      /* -------------------- Parent Screens -------------------- */
      function ParentTopUp({ focusChildId }) {
        const { store, updateUser } = useContext(StoreCtx);
        const { user } = useContext(AuthCtx);
        const isParent = user.type === "parent";
        const childIds = isParent ? user.childIds : [user.id];
        const [selected, setSelected] = useState(
          focusChildId || childIds[0] || null
        );
        useEffect(() => {
          if (focusChildId) setSelected(focusChildId);
        }, [focusChildId]);

        const student = selected ? store.users[selected] : null;
        const [amount, setAmount] = useState("500");
        const [mode, setMode] = useState("General");

        const send = () => {
          if (!student) return alert("Select a student");
          const v = parseInt(amount || "0", 10);
          if (!v) return;
          if (mode === "General")
            updateUser(student.id, { wallet: student.wallet + v });
          else
            updateUser(student.id, {
              restrictedWallets: {
                ...student.restrictedWallets,
                [mode]: (student.restrictedWallets[mode] || 0) + v,
              },
            });
          alert(`Top-up sent: ₹${v} (${mode}) to ${student.name}`);
        };

        return (
          <Page>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <Card
                title={
                  isParent
                    ? `Top-up ${student ? student.name : "(select child)"}`
                    : "Request from Parent"
                }
                subtitle="Simple, clear and fast"
              >
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <input
                    className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                    type="number"
                    value={amount}
                    onChange={(e) => setAmount(e.target.value)}
                  />
                  <select
                    className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                    value={mode}
                    onChange={(e) => setMode(e.target.value)}
                  >
                    {["General", "Mess", "Hostel"].map((m) => (
                      <option key={m}>{m}</option>
                    ))}
                  </select>
                  <button
                    onClick={send}
                    type="button"
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700"
                  >
                    {isParent ? "Send Top-up" : "Request Top-up"}
                  </button>
                </div>
                {isParent && (
                  <div className="mt-4">
                    <label className="text-xs block mb-1 text-slate-800 dark:text-slate-200">
                      Select student
                    </label>
                    <select
                      className="border dark:border-slate-700 rounded-xl px-3 py-2 w-full bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
                      value={selected || ""}
                      onChange={(e) => setSelected(e.target.value)}
                    >
                      <option value="" disabled>
                        Select student
                      </option>
                      {childIds.map((cid) => (
                        <option key={cid} value={cid}>
                          {store.users[cid]?.name || cid}
                        </option>
                      ))}
                    </select>
                  </div>
                )}
                <div className="mt-2 text-xs text-slate-700 dark:text-slate-300">
                  Category top-ups go to a restricted balance usable only for
                  that category.
                </div>
              </Card>

              <Card
                title={`${student ? student.name + "'s" : "Student"} Balances`}
                subtitle="At-a-glance totals"
                variant="glass"
              >
                {student ? (
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <Stat label="Wallet" value={`₹${student.wallet}`} />
                    <Stat
                      label="Mess (restricted)"
                      value={`₹${student.restrictedWallets.Mess || 0}`}
                    />
                    <Stat
                      label="Hostel (restricted)"
                      value={`₹${student.restrictedWallets.Hostel || 0}`}
                    />
                    <Stat label="Savings" value={`₹${student.savings}`} />
                  </div>
                ) : (
                  <p className="text-sm text-slate-700 dark:text-slate-300">
                    Select a student to view balances.
                  </p>
                )}
              </Card>
            </div>
          </Page>
        );
      }

      function ParentMonitor() {
        const { store } = useContext(StoreCtx);
        const { user } = useContext(AuthCtx);
        const kids = user.childIds.map((id) => store.users[id]).filter(Boolean);
        return (
          <Page>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {kids.map((k) => (
                <Card
                  key={k.id}
                  title={`📊 ${k.name}`}
                  subtitle={k.college || "—"}
                  right={
                    <span className="text-xs text-slate-800 dark:text-slate-200">
                      Code: {k.code}
                    </span>
                  }
                >
                  <div className="grid grid-cols-2 gap-3">
                    <Stat label="Wallet" value={`₹${k.wallet}`} />
                    <Stat label="Savings" value={`₹${k.savings}`} />
                    <Stat
                      label="Weekly Avg"
                      value={`₹${Math.round(
                        k.weeklySpend.reduce((a, b) => a + b, 0) /
                          k.weeklySpend.length
                      )}`}
                    />
                    <Stat
                      label="Restrictions"
                      value={`M ₹${k.restrictedWallets.Mess || 0} · H ₹${
                        k.restrictedWallets.Hostel || 0
                      }`}
                    />
                  </div>
                </Card>
              ))}
              {!kids.length && (
                <Card
                  title="No students linked yet"
                  subtitle="Add your child using their Student Code in the Manage tab."
                ></Card>
              )}
            </div>
          </Page>
        );
      }

      function ManageStudents() {
        const { store, linkChildToParent } = useContext(StoreCtx);
        const { user } = useContext(AuthCtx);
        const [code, setCode] = useState("");
        const add = () => {
          if (!code.trim()) return;
          const res = linkChildToParent({
            parentId: user.id,
            studentCode: code.trim(),
          });
          if (!res.ok) alert(res.reason || "Failed to link");
          else alert("Student linked!");
          setCode("");
        };
        return (
          <Page>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <Card
                title="Link a Student by Code"
                subtitle="Securely connect to your child"
              >
                <div className="flex gap-3">
                  <input
                    className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                    placeholder="Enter Student Code (e.g., STU-ABCD-EFGH)"
                    value={code}
                    onChange={(e) => setCode(e.target.value)}
                  />
                  <button
                    onClick={add}
                    type="button"
                    className="px-4 py-2 rounded-xl btn-grad text-white shadow-soft"
                  >
                    Link
                  </button>
                </div>
                <p className="text-xs text-slate-700 dark:text-slate-300 mt-2">
                  Ask your child to log in as Student to generate & share their
                  unique code.
                </p>
              </Card>
              <Card title="Linked Students" subtitle="Overview">
                <ul className="space-y-2">
                  {user.childIds.map((cid) => {
                    const c = store.users[cid];
                    return (
                      <li
                        key={cid}
                        className="p-3 border dark:border-slate-700 rounded-xl flex justify-between items-center bg-slate-50/90 dark:bg-slate-800/60"
                      >
                        <div>
                          <p className="font-medium text-slate-900 dark:text-slate-100">
                            {c?.name || cid}
                          </p>
                          <p className="text-xs text-slate-700 dark:text-slate-300">
                            Code: {c?.code} · Wallet ₹{c?.wallet}
                          </p>
                        </div>
                        <span className="text-xs px-2 py-1 rounded bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100">
                          {c?.college || "—"}
                        </span>
                      </li>
                    );
                  })}
                  {!user.childIds.length && (
                    <p className="text-sm text-slate-700 dark:text-slate-300">
                      No students linked.
                    </p>
                  )}
                </ul>
              </Card>
            </div>
          </Page>
        );
      }

      /* -------------------- Auth/Login -------------------- */
      function StudentLoginCard() {
        const { createStudent } = useContext(StoreCtx);
        const { setSession } = useContext(AuthCtx);
        const [name, setName] = useState("");
        const [college, setCollege] = useState("");

        const submit = () => {
          const s = createStudent({ name: name || "Student", college });
          setSession({ id: s.id, type: "student" });
          alert(
            `Welcome ${s.name}! Your Student Code is ${s.code}. Share it with your parent.`
          );
        };

        return (
          <div className="glass rounded-2xl p-6 shadow-soft animate-enter">
            <h3 className="text-xl font-extrabold mb-2 text-slate-900 dark:text-white">
              Student Login / Create
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <input
                className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                placeholder="Your Name"
                value={name}
                onChange={(e) => setName(e.target.value)}
              />
              <input
                className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                placeholder="College"
                value={college}
                onChange={(e) => setCollege(e.target.value)}
              />
            </div>
            <button
              onClick={submit}
              type="button"
              className="mt-3 px-4 py-2 rounded-xl btn-grad text-white shadow-soft w-full"
            >
              Continue
            </button>
            <p className="text-xs text-slate-800 dark:text-slate-200 mt-2">
              A unique Student Code will be generated and shown after login.
            </p>
          </div>
        );
      }

      function ParentLoginCard() {
        const { createParent, findStudentByCode } = useContext(StoreCtx);
        const { setSession } = useContext(AuthCtx);
        const [name, setName] = useState("");
        const [firstCode, setFirstCode] = useState("");

        const submit = () => {
          let firstId = null;
          if (firstCode.trim()) {
            const stu = findStudentByCode(firstCode.trim());
            if (!stu) {
              alert("No student found for that code");
              return;
            }
            firstId = stu.id;
          }
          const p = createParent({
            name: name || "Parent",
            studentIds: firstId ? [firstId] : [],
          });
          setSession({ id: p.id, type: "parent" });
          alert(
            `Welcome ${p.name}! ${
              firstId
                ? "Linked 1 student."
                : "You can link students any time from Manage tab."
            }`
          );
        };

        return (
          <div className="glass rounded-2xl p-6 shadow-soft animate-enter">
            <h3 className="text-xl font-extrabold mb-2 text-slate-900 dark:text-white">
              Parent Login / Create
            </h3>
            <div className="grid grid-cols-1 gap-3">
              <input
                className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                placeholder="Your Name"
                value={name}
                onChange={(e) => setName(e.target.value)}
              />
              <input
                className="border dark:border-slate-700 rounded-xl px-3 py-2 text-black"
                placeholder="(Optional) Student Code"
                value={firstCode}
                onChange={(e) => setFirstCode(e.target.value)}
              />
            </div>
            <button
              onClick={submit}
              type="button"
              className="mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 w-full"
            >
              Continue
            </button>
            <p className="text-xs text-slate-800 dark:text-slate-200 mt-2">
              You can add multiple Student Codes after login too.
            </p>
          </div>
        );
      }

      function Login() {
        const [tab, setTab] = useState("student");
        const { theme } = useContext(ThemeCtx);
        return (
          <div className="min-h-screen brand-gradient flex items-center justify-center p-4 relative overflow-hidden">
            {/* floating blobs */}
            <div className="absolute inset-0 -z-0 opacity-40">
              <div className="absolute top-10 left-10 w-56 h-56 rounded-full bg-emerald-400 blur-3xl animate-floaty"></div>
              <div
                className="absolute bottom-10 right-10 w-72 h-72 rounded-full bg-sky-500 blur-3xl animate-floaty"
                style={{ animationDelay: "-2s" }}
              ></div>
            </div>

            <div className="max-w-4xl w-full grid md:grid-cols-2 gap-6 relative z-10">
              <div className="glass rounded-2xl p-8 shadow-soft text-center">
                <div className="flex flex-col items-center mb-6">
                  <div className="w-16 h-16 rounded-2xl bg-emerald-200/70 dark:bg-emerald-300/20 flex items-center justify-center text-3xl animate-floaty">
                    🐧
                  </div>
                  <h1 className="text-3xl md:text-4xl font-extrabold text-slate-900 dark:text-white mt-3">
                    Finmate
                  </h1>
                  <p className="text-slate-800 dark:text-slate-200">
                    Campus finance, made friendly
                  </p>
                </div>
                <div className="inline-flex bg-slate-100 dark:bg-slate-800 rounded-2xl overflow-hidden shadow-soft">
                  <button
                    onClick={() => setTab("student")}
                    type="button"
                    className={`px-4 py-2 ${
                      tab === "student"
                        ? "bg-white dark:bg-slate-700 font-semibold"
                        : "opacity-80"
                    }`}
                  >
                    Student
                  </button>
                  <button
                    onClick={() => setTab("parent")}
                    type="button"
                    className={`px-4 py-2 ${
                      tab === "parent"
                        ? "bg-white dark:bg-slate-700 font-semibold"
                        : "opacity-80"
                    }`}
                  >
                    Parent
                  </button>
                </div>
                <p className="text-xs text-white/90 mt-4">
                  Theme now: {theme === "dark" ? "Dark" : "Light"} (toggle after
                  login)
                </p>
              </div>
              {tab === "student" ? <StudentLoginCard /> : <ParentLoginCard />}
            </div>
          </div>
        );
      }

      /* -------------------- App Root with LEFT SIDEBAR -------------------- */
      function App() {
        const [active, setActive] = useState("dashboard");
        const [parentChildId, setParentChildId] = useState("");
        const [open, setOpen] = useState(false);
        const { user, logout } = useContext(AuthCtx);
        if (!user) return <Login />;

        const isParent = user.type === "parent";

        return (
          <div className="flex min-h-screen">
            {/* Sidebar */}
            <Sidebar
              active={active}
              setActive={setActive}
              isOpen={open}
              setIsOpen={setOpen}
              parentChildId={parentChildId}
              setParentChildId={setParentChildId}
            />
            {/* Main area */}
            <div className="flex-1 min-w-0">
              {/* Top microbar for mobile with menu & logout */}
              <div className="md:hidden flex items-center justify-between p-3 bg-white/80 dark:bg-slate-900/80 sticky top-0 backdrop-blur z-30">
                <button
                  className="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800"
                  onClick={() => setOpen(true)}
                >
                  ☰
                </button>
                <div className="font-bold">Produscope</div>
                <button
                  onClick={logout}
                  className="px-3 py-2 rounded-xl bg-rose-500 text-white"
                >
                  Logout
                </button>
              </div>

              {/* Content */}
              {isParent
                ? {
                    parent: (
                      <ParentTopUp focusChildId={parentChildId || undefined} />
                    ),
                    monitor: <ParentMonitor />,
                    manage: <ManageStudents />,
                    leader: <Leaderboard />,
                  }[active] || (
                    <ParentTopUp focusChildId={parentChildId || undefined} />
                  )
                : {
                    dashboard: <Dashboard />,
                    weekly: <WeeklyAvg />,
                    categories: <Categories />,
                    savings: <Savings />,
                    commit: <CommitLocks />,
                    split: <GroupSplit />,
                    offers: <Offers />,
                    upi: <UpiLink />,
                    parent: <ParentTopUp />,
                    leader: <Leaderboard />,
                  }[active] || <Dashboard />}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(
        <ThemeProvider>
          <StoreProvider>
            <AuthProvider>
              <App />
            </AuthProvider>
          </StoreProvider>
        </ThemeProvider>
      );
    </script>
  </body>
</html>
